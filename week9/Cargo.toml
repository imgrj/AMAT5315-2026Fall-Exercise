[package]
name = "infer"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "Exact tensor-network inference and loopy belief propagation for UAI models"
license = "MIT"

[[bin]]
name = "infer"
path = "src/main.rs"

[dependencies]
tenferro-tensor = "0.9.0"
tenferro-cpu = "0.9.0"
tenferro-einsum = "0.9.0"
omeco = "0.2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
