[package]
name = "tnsample"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Tropical tensor contraction, Boltzmann sampling and N-queens counting for the Week 11 sheet"
license = "MIT"

[[bin]]
name = "tnsample"
path = "src/main.rs"

[lib]
name = "tnsample"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
omeco = "0.2.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
