[package]
name = "branchopt"
version = "1.0.0"
edition = "2021"
description = "Spin-glass mixed-integer programs, exact Branch-and-Bound and a learned branching rule"

[dependencies]
highs = "2.4"
highs-sys = { version = "1.16", features = ["ninja"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
