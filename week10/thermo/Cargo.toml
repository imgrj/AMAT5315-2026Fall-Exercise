[package]
name = "thermo"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "Truncated SVD, boundary-MPS and TRG partition functions of the square Ising model"
license = "MIT"

[[bin]]
name = "thermo"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
