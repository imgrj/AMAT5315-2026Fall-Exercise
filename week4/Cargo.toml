[package]
name = "week4"
version = "0.1.0"
edition = "2021"

[dependencies]
rustfft = "6.4.1"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "week4"
path = "src/lib.rs"

[[bin]]
name = "field"
path = "src/bin/field.rs"

[[bin]]
name = "fluid"
path = "src/bin/fluid.rs"

[[bin]]
name = "line_runner"
path = "src/bin/line_runner.rs"

[profile.release]
opt-level = 3
debug = true
